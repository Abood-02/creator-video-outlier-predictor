version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outlier_predictor_api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
      - HUGGINGFACE_HUB_CACHE=/app/hf_cache
    volumes:
      - ./artifacts:/app/artifacts
      - ./mlflow.db:/app/mlflow.db
    restart: unless-stopped
    depends_on:
      - mlflow-ui

  mlflow-ui:
    image: python:3.11-slim
    container_name: outlier_predictor_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./artifacts:/app/artifacts
    working_dir: /app
    command: >
      bash -c "pip install mlflow sqlalchemy && 
               mlflow ui --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./artifacts -h 0.0.0.0 -p 5000"
    restart: unless-stopped
